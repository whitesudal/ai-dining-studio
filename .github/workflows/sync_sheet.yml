name: 낙지마실 실제 메뉴(낙곱새) 수동 반영

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client pyyaml

      - name: Run sync script
        env:
          SHEET_JSON: ${{ secrets.SHEET_JSON }}
        run: |
          echo "$SHEET_JSON" > service_account.json
          python scripts/sync_sheets.py
          rm service_account.json

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "낙지마실 데이터 수동 업데이트"
          git push

