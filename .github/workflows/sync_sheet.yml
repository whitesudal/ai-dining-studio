name: Sync Sheet to Site

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r automation/requirements.txt

      - name: Write Google credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p automation/keys
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > automation/keys/service_account.json

      - name: Create config.yaml
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          cat > automation/config.yaml <<EOF
          google_sheet:
            sheet_id: "$GOOGLE_SHEET_ID"
            worksheet_name: "시트1"
            google_credentials: "automation/keys/service_account.json"

          openai:
            model: "gpt-4o-mini"
          EOF

      - name: Run script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python automation/main.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add site/
          git diff --cached --quiet || git commit -m "Auto update from sheet"
          git push
