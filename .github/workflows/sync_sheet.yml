name: Sync Sheet to Site

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r automation/requirements.txt

      - name: Write Google credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p automation/keys
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > automation/keys/service_account.json

      - name: Run script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python automation/main.py

      - name: Create config.yaml
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          cat > automation/config.yaml <<EOF

          google_sheet:
            sheet_id: "$GOOGLE_SHEET_ID"
            worksheet_name: "시트1"
            google_credentials: "automation/keys/service_account.json"

          openai:
            model: "gpt-4o-mini"

          paths:
            output_dir: "docs/output"
            template_dir: "automation/templates"
          EOF

      - name: Commit and push if changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/output
          git commit -m "Auto: generate outputs from sheet"
          git push
